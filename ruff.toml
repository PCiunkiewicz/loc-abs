# Exclude a variety of commonly ignored directories.
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".ipynb_checkpoints",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pyenv",
  ".pytest_cache",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  ".vscode",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "site-packages",
  "venv",
  "migrations",
]

# Same as Black.
line-length = 120
indent-width = 4

# Assume Python 3.13
target-version = "py313"

# Set source directories.
src = [
  "backend",
  "backend/api",
  "backend/simulation",
  "backend/tools",
  "backend/utilities",
  "frontend",
  "frontend/components",
  "frontend/content",
  "frontend/utilities",
]

[lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F"]
ignore = ["ANN401", "D106", "DJ008"]
extend-select = [
  "ANN", # flake-8 annotations
  "B",   # flake-8 bugbear
  "A",   # flake-8 builtins
  "C",   # flake-8 comprehensions
  "DJ",  # flake-8 Django
  "FA",  # flake-8 future annotations
  "ICN", # flake-8 import conventions
  "PIE", # flake-8 pie
  "T20", # flake-8 print
  "RET", # flake-8 return
  "SIM", # flake-8 simplify
  "TID", # flake-8 tidy imports
  "TC",  # flake-8 type checking
  "ARG", # flake-8 unused arguments
  "PTH", # flake-8 pathlib
  "I",   # isort
  "NPY", # numpy-specific rules
  "PD",  # pandas-specific rules
  "N",   # pep8 naming
  "W",   # pycodestyle warnings
  "D",   # pydocstyle
  "PL",  # pylint
  "UP",  # pyupgrade
  "RUF", # ruff-specific rules
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.flake8-tidy-imports]
# Disallow all relative imports.
ban-relative-imports = "all"

[lint.pydocstyle]
convention = "google"

[format]
quote-style = "single"

indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

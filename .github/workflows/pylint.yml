name: Pylint

on:
  push:
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install pylint
        run: pip install pylint pylint-django

      - name: Run pylint
        run: pylint -v $(git ls-files '*.py')
